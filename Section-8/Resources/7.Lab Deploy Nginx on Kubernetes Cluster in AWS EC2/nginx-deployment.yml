apiVersion: apps/v1
kind: Deployment
metadata: 
  name: nginx-deplyment
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: nginx-instance
  template: 
    metadata: 
      labels:
        app: nginx-instance
    spec: 
      containers:
      - name: nginx-instance
        image: nginx
        ports:
        - containerPort: 80
