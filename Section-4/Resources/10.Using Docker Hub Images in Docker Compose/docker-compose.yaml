services:
  webapp:
    image: rrath753/php-app:v2
    container_name: phpapp-instance
    networks:
      - app-network
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-instance
    networks:
      - app-network
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "appusr@1090"

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  mysql-data:
    name: mysql-data