services:

  db:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: appusr@1090
      MYSQL_DATABASE: appdb
      MYSQL_USER: appusr
      MYSQL_PASSWORD: appusr@1090
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  webapp:
    image: phpapp:v2
    container_name: php-container
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge