version: '3.8'
services:
  webapp:
    image: phpapp:v2
    build: .
    ports:
      - "8080:80"     
  db:
    image: mysql-image:latest
    container_name: mysql-instance
    networks:
      - app-network
    volumes:
      - type: volume
        source: mysql-data
        target: /var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=appusr@1090
networks:
  app-network:
    name: "app-network"
    ipam: 
      driver: default
      config:
        - subnet: 10.0.0.0/16
volumes:
  mysql-data:
    name: "mysql-data"