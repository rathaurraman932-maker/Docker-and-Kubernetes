apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: web-servers

  template:
    metadata:
      labels:
        app: web-servers

    spec:
      containers:
        - name: nginx-instance
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: nginx-volume

        - name: apache-instance
          image: httpd
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /usr/local/apache2/htdocs
              name: nginx-volume

      volumes:
        - name: nginx-volume
          emptyDir: {}