services:
  webapp:
    image: rrath753/php-app:v3
    container_name: phpapp-instance
    restart: always
    networks:
      - app-network
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql-instance
    restart: always
    networks:
      - app-network
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "appusr@1090"
      MYSQL_DATABASE: appdb
      MYSQL_USER: appusr
      MYSQL_PASSWORD: "appusr@1090"

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql-data:
    name: s3-mysql-data